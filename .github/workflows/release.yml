name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.1.1"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    container: rust:1.98-bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            linker: ""
          - target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install binary inspection tool
        run: apt-get update && apt-get install -y binutils
      - name: Install aarch64 linker
        if: matrix.linker != ''
        run: apt-get update && apt-get install -y gcc-aarch64-linux-gnu
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release shared library
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify GNU libc compatibility
        run: >-
          bash scripts/check-glibc.sh
          target/${{ matrix.target }}/release/libfluent_bit_pubsub_rs.so
          GLIBC_2.34
      - name: Package artifact
        run: |
          mkdir -p dist
          asset="fluent-bit-pubsub-rs-${RELEASE_TAG}-${{ matrix.target }}.so"
          cp target/${{ matrix.target }}/release/libfluent_bit_pubsub_rs.so "dist/${asset}"
          (cd dist && sha256sum "${asset}" > "${asset}.sha256")
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/fluent-bit-pubsub-rs-${{ env.RELEASE_TAG }}-${{ matrix.target }}.so
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: fluent-bit-pubsub-rs-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag
