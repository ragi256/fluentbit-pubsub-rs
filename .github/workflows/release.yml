name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            linker: ""
          - target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install aarch64 linker
        if: matrix.linker != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release shared library
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifact
        run: |
          mkdir -p dist
          asset="fluent-bit-pubsub-rs-${RELEASE_TAG}-${{ matrix.target }}.so"
          cp target/${{ matrix.target }}/release/libfluent_bit_pubsub_rs.so "dist/${asset}"
          (cd dist && sha256sum "${asset}" > "${asset}.sha256")
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/fluent-bit-pubsub-rs-${{ env.RELEASE_TAG }}-${{ matrix.target }}.so
      - uses: actions/upload-artifact@v7
        with:
          name: fluent-bit-pubsub-rs-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag
