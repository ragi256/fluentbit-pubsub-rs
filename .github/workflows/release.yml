name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            linker: ""
          - target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v7
      - name: Install aarch64 linker
        if: matrix.linker != ''
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release shared library
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifact
        run: |
          mkdir -p dist/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/libfluent_bit_pubsub_rs.so dist/${{ matrix.target }}/
          tar -C dist/${{ matrix.target }} -czf fluent-bit-pubsub-rs-${{ matrix.target }}.tar.gz libfluent_bit_pubsub_rs.so
      - uses: actions/upload-artifact@v7
        with:
          name: fluent-bit-pubsub-rs-${{ matrix.target }}
          path: fluent-bit-pubsub-rs-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_SHA}" dist/*.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Build ${GITHUB_SHA}" \
            --notes "Automated release artifacts for ${GITHUB_SHA}."
