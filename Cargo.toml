[package]
name = "fluent-bit-pubsub-rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
env_logger = "0.11.9"
google-cloud-gax = "1.8.0"
google-cloud-auth = "1.7.0"
google-cloud-pubsub = "0.33.0"
libc = "0.2.183"
log = "0.4.29"
rmpv = "1.3.1"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
