[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

[INPUT]
    Name         dummy
    Tag          e2e.data
    Dummy        {"data":"message from data"}
    Samples      1

[INPUT]
    Name         dummy
    Tag          e2e.log
    Dummy        {"log":"message from log"}
    Samples      1

[OUTPUT]
    Name         pubsub
    Match        e2e.data
    Project      e2e-project
    Topic        e2e-data
    MessageKey   data
    Attributes   {"source":"data"}
    Timeout      10000

[OUTPUT]
    Name         pubsub
    Match        e2e.log
    Project      e2e-project
    Topic        e2e-log
    MessageKey   log
    Attributes   {"source":"log"}
    Timeout      10000
