[SERVICE]
    Flush        0.5
    Daemon       Off
    Log_Level    info

[INPUT]
    Name         dummy
    Tag          e2e.load
    Dummy        {"data":"load-test"}
    Rate         1000
    Samples      0

[OUTPUT]
    Name           pubsub
    Match          *
    Project        e2e-project
    Topic          e2e-load
    MessageKey     data
    Timeout        10000
    DelayThreshold 1
    CountThreshold 1
